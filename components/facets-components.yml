provider: Facets
providerId: facets
note: >-
  Facets' embeddable-UI story is the inverse of the usual one. Most providers ship a library
  of THEIR components for you to drop into YOUR app. Facets ships a contract for YOU to build
  components that render inside THEIR control plane. There is no Facets element library, no
  npm loader package and no CDN bundle to import; there is a registration mechanism, a
  runtime contract, and a set of reference components published as separate GitHub repos.
families:
  - name: Facets Web Components SDK
    kind: host-embedded custom elements
    docs: https://www.facets.cloud/docs/web-components
    standard: Custom Elements v1 + Shadow DOM (browser-native, no framework, no build step)
    runtime_contract:
      loader: >-
        Facets fetches your .js file from the remoteURL you registered and injects it as
        <script type="text/javascript"> - NOT as an ES module.
      constraints:
        - No import or export statements - ES module syntax throws a SyntaxError.
        - No top-level await.
        - No external dependencies; everything inlined in a single self-contained .js file.
        - Must call customElements.define() at top level, not inside a function.
        - Must attachShadow({mode:'open'}) in the constructor and query via this.shadowRoot.
      lifecycle: [constructor, connectedCallback, disconnectedCallback, attributeChangedCallback]
      context: Facets passes contextual attributes (user data, custom config) and renders the element in an isolated container in the sidebar or a tab.
    registration:
      via_ui: Register a component against a Facets instance with a remoteURL.
      via_api: 'ui-web-component-controller - 6 operations in openapi/facets-control-plane-openapi.yml.'
      scoping: 'Since release v0.94, components can be sourced from a Git repository or a bundle upload and scoped to a project or an environment.'
    integration_paths:
      - {name: Via Praxis, docs: https://www.facets.cloud/docs/web-components/via-praxis, note: 'A single Praxis conversation scaffolds the component, deploys it to GitHub Pages and registers it.'}
      - {name: Manual, docs: https://www.facets.cloud/docs/web-components/manual-guide, guides: [developer-guide, api-integration-guide, deployment-guide, testing-guide, sample-web-component]}
    use_cases:
      - Custom dashboards over Facets API data (environment metrics, release timelines, cost breakdowns).
      - Team-specific tooling embedded in the deployment context (runbooks, approval flows, incident trackers).
      - Extending the control plane without forking it.
      - Per-team customisation against one shared Facets instance.
