  cdn_note: >-
    A GitHub Pages host for built bundles of the Facets-cloud/webcomponents monorepo (which
    is not public). There is no npm package, no jsDelivr/unpkg entry and no pinned version
    URL, so a consumer cannot pin what they load - the same finding as an unpinned CDN
    distribution. version: null, deliberately.
