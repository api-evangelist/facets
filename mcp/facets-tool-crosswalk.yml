note: >-
  The live MCP servers are stdio-only and authenticate against a customer control plane, so
  tools/list could not be introspected anonymously. Every row below is mapped by name and by
  the tool description the provider publishes, against operationIds that were grepped and
  verified to exist verbatim in the harvested spec. Confidence is set honestly: `high` where
  the tool name and the operation are a one-to-one semantic match, `medium` where the tool
  fans out to more than one operation or the provider's naming diverges from the spec's
  (Facets calls the same object a "project" in the MCP layer and a "stack" in the REST
  layer, and an "environment" in the MCP layer and a "cluster" in the REST layer).
