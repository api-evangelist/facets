shared_rules:
  - 'Base URL is per-tenant: https://{account-id}.console.facets.cloud. There is no shared API host.'
  - 'Auth is HTTP Basic - sign-in email as username, a personal access token as password.'
  - 'REST says stack/cluster where the product says project/environment. Translate before every call.'
  - 'There is NO idempotency mechanism. Never blind-retry a write; re-read state and decide.'
  - 'No rate limits and no 429 are published. Back off conservatively anyway.'
  - 'Errors are {code, message}, not RFC 9457. 401 is returned but not declared in the spec.'
