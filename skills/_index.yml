note: >-
  Facets publishes its OWN agent skills too, and they are the better source when you have
  access: `praxis login` installs the organisation's skill catalogue from the control plane,
  and `raptor install-skills --agent claude` installs the CLI skills that ship inside the
  raptor binary. Both are per-tenant and could not be harvested from outside a customer
  account. These four skills are the catalog-side complement - grounded in the public
  OpenAPI, usable against any Facets control plane, and written for direct REST callers
  rather than for raptor.
