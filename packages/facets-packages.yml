  PyPI JSON API (pypi.org/pypi/<pkg>/json), Terraform Registry v1 API
  (registry.terraform.io/v1/providers/Facets-cloud/facets), GitHub Releases API for the
  Facets-cloud organization, and the Facets-cloud/homebrew-tap cask, all fetched 2026-09-07.
provider: Facets
providerId: facets
note: >-
  Facets publishes NO language SDK for the Control Plane REST API - there is no first-party
  npm, PyPI, Maven, NuGet, Go or RubyGems client library that wraps the 629 documented
  operations. What Facets does ship first-party is a CLI (raptor), an agent CLI (praxis),
  three MCP servers on PyPI, and a Terraform provider. Consumers of the REST API hand-roll
  HTTP with HTTP Basic auth. A registry search on 2026-09-07 for facets-cli, @facets/sdk and
  @facets-cloud/* on npm returned no packages. No `SDKs` pointer is emitted for this
  provider because none of the packages below is a language client for the REST API.
