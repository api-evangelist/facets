          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Internal Server Error
      tags:
      - ui-promotion-workflow-controller
      summary: Create workflow
      x-summary-source: derived
