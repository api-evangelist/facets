      - ui-promotion-workflow-controller
      summary: Get workflows by stack
      x-summary-source: derived
  /cc-ui/v1/workflow/default-workflow/registration-type/{registrationType}:
    get:
      operationId: getDefaultWorkflow
      parameters:
      - in: path
        name: registrationType
        required: true
        schema:
          type: string
          enum:
          - ENVIRONMENT
          - RELEASE_STREAM
          - HYBRID
      - in: query
        name: stackName
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionWorkflow'
          description: OK
        '400':
