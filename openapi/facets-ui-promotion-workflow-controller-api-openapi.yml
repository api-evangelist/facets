components:
  schemas:
    GithubAppPermissionsPendingErrorDetails:
      type: object
      properties:
        approvalUrl:
          type: string
        code:
          type: string
        errorCode:
          type: string
        message:
          type: string
        missingPermissions:
          type: array
          items:
            type: string
    ErrorDetails:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    PromotionWorkflow:
      required:
      - registrationType
      - workflowName
      type: object
      properties:
        createdBy:
          type: string
        creationDate:
          type: string
          format: date-time
        defaultWorkflow:
          type: boolean
        hierarchies:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowHierarchy'
        id:
          type: string
        lastModifiedBy:
          type: string
        lastModifiedDate:
          type: string
          format: date-time
        registrationType:
          type: string
          enum:
          - ENVIRONMENT
          - RELEASE_STREAM
          - HYBRID
        stackName:
          type: string
        workflowName:
          type: string
    WorkflowHierarchy:
      type: object
      properties:
        registrationValue:
          type: string
        sequence:
          type: integer
          format: int32
  securitySchemes:
    basicAuth:
      description: Basic Authentication
      scheme: basic
      type: http
