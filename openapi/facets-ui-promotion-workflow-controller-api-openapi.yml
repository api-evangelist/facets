      summary: Get registration specific workflows
      x-summary-source: derived
  /cc-ui/v1/workflow/{workflowId}:
    delete:
      operationId: deleteWorkflow
      parameters:
      - in: path
        name: workflowId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
