  /cc-ui/v1/modules/upload:
    post:
      description: '- **Description:** Uploads a module using a file.

        - **Permissions:** Requires MODULE_WRITE permission.

        - **Parameters:**

        - `file`: The module file to upload

        - `metadata` (optional): Additional module metadata including:

        - `gitUrl`: Web URL of the git repository (Expected to embed the commit id)

        - `gitRef`: Git reference (branch, tag, or commit)

        - `isFeatureBranch`: If this is true, this preview module cannot be directly marked as published until we register the module again with this as false.

        - **Audit Logging:** Yes'
      operationId: uploadModule
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  $ref: '#/components/schemas/ModuleMetadata'
              required:
              - file
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TFModule'
          description: OK
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorDetails'
                - $ref: '#/components/schemas/GithubAppPermissionsPendingErrorDetails'
          description: Bad Request
