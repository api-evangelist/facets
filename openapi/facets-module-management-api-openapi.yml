  /cc-ui/v1/modules:
    get:
      description: '- **Description:** Retrieves all modules with optional filtering.

        - **Parameters:**

        - `canDownload` (optional): When true, returns only modules that have downloadable content (modules with path). Defaults to false.

        - **Permissions:** Requires MODULE_READ permission.

        - **Audit Logging:** No specific audit logging at the moment.'
      operationId: getAllModules
      parameters:
      - in: query
        name: canDownload
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TFModuleListResponseDTO'
          description: OK
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorDetails'
                - $ref: '#/components/schemas/GithubAppPermissionsPendingErrorDetails'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Not Found
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Method Not Allowed
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Internal Server Error
      summary: Get All Modules
      tags:
      - Module Management
