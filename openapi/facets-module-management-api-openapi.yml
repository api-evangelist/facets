      type: object
      properties:
        default:
          type: boolean
        outputName:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
    GithubAppPermissionsPendingErrorDetails:
      type: object
      properties:
        approvalUrl:
          type: string
        code:
          type: string
        errorCode:
          type: string
        message:
          type: string
        missingPermissions:
          type: array
          items:
            type: string
    OtherVersion:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
    TemplateResponseDTO:
      type: object
      properties:
        clouds:
          uniqueItems: true
          type: array
          items:
            type: string
        description:
          type: string
        displayName:
          type: string
        group:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
