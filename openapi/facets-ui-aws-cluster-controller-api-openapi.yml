  /cc-ui/v1/aws/clusters/validate-vpcId:
    get:
      operationId: validateVpcId_1
      parameters:
      - in: query
        name: vpcId
        required: true
        schema:
          type: string
      - in: query
        name: region
        required: true
        schema:
          type: string
      - in: query
        name: accountId
        required: true
