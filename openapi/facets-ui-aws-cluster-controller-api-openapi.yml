      x-summary-source: derived
  /cc-ui/v1/aws/clusters/onboard-customer:
    post:
      operationId: onboardCustomer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOnboardRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          content:
            application/json:
              schema:
                oneOf:
