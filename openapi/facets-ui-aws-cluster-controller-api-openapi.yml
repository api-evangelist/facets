    put:
      operationId: updateClusterUsingPUT2
      parameters:
      - in: path
        name: clusterId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwsClusterRequest'
        required: true
