components:
  schemas:
    UserGroup:
      type: object
      properties:
        accounts:
          uniqueItems: true
          type: array
          items:
            type: string
        additionalRoles:
          uniqueItems: true
          type: array
          items:
            type: string
        associatedResourceGroups:
          type: array
          items:
            type: string
        baseRole:
          type: string
        changeLog:
          type: string
        clusterIds:
          uniqueItems: true
          type: array
          items:
            type: string
        clusterRoleBindings:
          type: object
          additionalProperties:
            type: string
        description:
          maxLength: 200
          minLength: 0
          type: string
        groupName:
          type: string
        id:
          type: string
        stackNames:
          uniqueItems: true
          type: array
          items:
            type: string
        versioningKey:
          type: string
    EnvSpecificAccess:
      type: object
      properties:
        clusterId:
          type: string
        envName:
          type: string
        project:
          type: string
        roleInfo:
          $ref: '#/components/schemas/RoleInfo'
    EnvInfo:
      type: object
      properties:
        clusterId:
          type: string
        envName:
          type: string
        project:
          type: string
    ErrorDetails:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    GithubAppPermissionsPendingErrorDetails:
      type: object
      properties:
        approvalUrl:
          type: string
        code:
          type: string
        errorCode:
          type: string
        message:
          type: string
        missingPermissions:
          type: array
          items:
            type: string
    RoleInfo:
      type: object
      properties:
        label:
          type: string
        roleName:
          type: string
    ExpandedUserGroup:
      type: object
      properties:
        accessibleAccounts:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        accessibleEnvironments:
          type: array
          items:
            $ref: '#/components/schemas/EnvInfo'
        accessibleProjects:
          uniqueItems: true
          type: array
          items:
            type: string
        associatedResourceGroups:
          type: array
          items:
            $ref: '#/components/schemas/IdName'
        baseRole:
          $ref: '#/components/schemas/RoleInfo'
        envSpecificRoles:
          type: array
          items:
            $ref: '#/components/schemas/EnvSpecificAccess'
        groupId:
          type: string
        groupName:
          type: string
    IdName:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
  securitySchemes:
    basicAuth:
      description: Basic Authentication
      scheme: basic
      type: http
