        name: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: pageSize
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - in: path
        name: clusterId
        required: true
        schema:
          type: string
      - in: query
        name: releaseType
        required: false
        schema:
          type: string
          enum:
          - HOTFIX
          - RELEASE
          - LAUNCH
          - DESTROY
          - CUSTOM
          - UNLOCK_STATE
          - PLAN
          - HOTFIX_PLAN
          - APPLY_PLAN
          - APPLY_HOTFIX_PLAN
          - SCALE_UP
          - SCALE_DOWN
          - MAINTENANCE
          - TERRAFORM_EXPORT
          - ROLLBACK_PLAN
          - APPLY_ROLLBACK_PLAN
          - PLAN_AND_APPLY
          - HOTFIX_PLAN_AND_APPLY
          - IMPORT_RELEASE
      - in: query
        name: signedOff
        required: false
        schema:
          type: boolean
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - SUCCEEDED
          - FAILED
          - FAULT
          - TIMED_OUT
          - IN_PROGRESS
          - STOPPED
          - INVALID
          - STARTED
          - UNKNOWN
          - QUEUED
          - PENDING_APPROVAL
          - APPROVED
          - ABORTED
          - REJECTED
          - SUPERSEDED
      - in: query
