        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - SUCCEEDED
            - FAILED
            - FAULT
            - TIMED_OUT
            - IN_PROGRESS
            - STOPPED
            - INVALID
            - STARTED
            - UNKNOWN
            - QUEUED
