            - APPROVED
            - ABORTED
            - REJECTED
            - SUPERSEDED
      - in: query
        name: triggeredBy
        required: false
        schema:
          type: string
      - in: query
        name: start
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: end
        required: false
        schema:
          type: string
          format: date-time
      - in: query
        name: tfVersion
        required: false
        schema:
          type: string
      responses:
