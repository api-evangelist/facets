              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Internal Server Error
      tags:
      - ui-versioning-controller
      summary: Restore soft delete
      x-summary-source: derived
  /cc-ui/v1/versions/softDeletedEntities/{entityType}:
    get:
      operationId: softDeletedEntitiesByType
      parameters:
      - in: path
        name: entityType
        required: true
        schema:
          type: string
          enum:
          - CLUSTER
          - BLUE_PRINT
          - TEMPLATE_INPUT
          - CONTROL_PLANE
          - IAC
          - ARTIFACT_CI
          - USER_GROUP
          - ACCOUNT
          - ARTIFACTORY
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: perPage
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - in: query
        name: sortBy
        required: false
        schema:
          type: string
          default: LAST_MODIFIED_DATE
          enum:
          - ID
          - CREATION_DATE
          - CREATED_BY
          - LAST_MODIFIED_DATE
          - LAST_MODIFIED_BY
      responses:
        '200':
          content:
            application/json:
              schema:
