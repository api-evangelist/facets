          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Internal Server Error
      tags:
      - ui-versioning-controller
      summary: Delete soft delete entity
      x-summary-source: derived
    get:
      operationId: softDeletedEntities
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: perPage
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - in: query
        name: sortBy
        required: false
        schema:
          type: string
          default: LAST_MODIFIED_DATE
          enum:
          - ID
          - CREATION_DATE
          - CREATED_BY
          - LAST_MODIFIED_DATE
          - LAST_MODIFIED_BY
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeletedEntitySoftDelete'
          description: OK
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorDetails'
                - $ref: '#/components/schemas/GithubAppPermissionsPendingErrorDetails'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Not Found
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Method Not Allowed
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Internal Server Error
      tags:
      - ui-versioning-controller
      summary: Soft deleted entities
      x-summary-source: derived
  /cc-ui/v1/versions/softDeletedEntities/all:
    delete:
      operationId: deleteAllSoftDeleteEntities
      responses:
        '200':
          description: OK
        '400':
          content:
            application/json:
              schema:
                oneOf:
