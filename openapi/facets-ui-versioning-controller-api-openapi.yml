      summary: Get versions paginated
      x-summary-source: derived
components:
  schemas:
    PageVersionVersioned:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/VersionVersioned'
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ErrorDetails:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    SoftDelete:
      type: object
      properties:
        id:
          type: string
    GithubAppPermissionsPendingErrorDetails:
      type: object
      properties:
        approvalUrl:
          type: string
        code:
          type: string
        errorCode:
          type: string
        message:
          type: string
        missingPermissions:
          type: array
          items:
            type: string
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    DeletedEntitySoftDelete:
      type: object
      properties:
        createdBy:
          type: string
        creationDate:
          type: string
          format: date-time
        entity:
          $ref: '#/components/schemas/SoftDelete'
        entityType:
          type: string
          enum:
          - CLUSTER
          - BLUE_PRINT
          - TEMPLATE_INPUT
          - CONTROL_PLANE
          - IAC
          - ARTIFACT_CI
          - USER_GROUP
          - ACCOUNT
          - ARTIFACTORY
        id:
          type: string
        lastModifiedBy:
          type: string
        lastModifiedDate:
          type: string
          format: date-time
    VersionVersioned:
      type: object
      properties:
        archiveDate:
          type: string
          format: date-time
        entity:
          $ref: '#/components/schemas/Versioned'
        id:
          type: string
        sequence:
          type: integer
          format: int64
          writeOnly: true
        sequenceKey:
          type: string
        version:
          type: integer
          format: int64
        versioningKey:
          type: string
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    Versioned:
      type: object
      properties:
        changeLog:
          type: string
          writeOnly: true
        versioningKey:
          type: string
    Version:
      type: object
      properties:
        archiveDate:
          type: string
          format: date-time
        entity:
          $ref: '#/components/schemas/Versioned'
        id:
          type: string
        sequence:
          type: integer
          format: int64
          writeOnly: true
        sequenceKey:
          type: string
        version:
          type: integer
          format: int64
        versioningKey:
          type: string
  securitySchemes:
    basicAuth:
      description: Basic Authentication
      scheme: basic
      type: http
