          description: Internal Server Error
      tags:
      - ui-versioning-controller
      summary: Get versions
      x-summary-source: derived
  /cc-ui/v1/versions/{versioningKey}/paginated:
    get:
      operationId: getVersionsPaginated
      parameters:
      - in: path
        name: versioningKey
        required: true
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: perPage
        required: false
