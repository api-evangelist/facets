          - TRASH_EMPTY
          - WEB_COMPONENT_CREATE
          - WEB_COMPONENT_UPDATE
          - WEB_COMPONENT_DELETE
          - ACTION_RUN
          - UNKNOWN
        entityActionLabel:
          type: string
        entityLabel:
          type: string
        id:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: object
        performedAt:
          type: string
          format: date-time
        performedBy:
          type: string
        source:
          type: string
          enum:
          - RAPTOR
        stackName:
          type: string
        target:
          type: string
    AuditEnumOption:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
    ErrorDetails:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    GithubAppPermissionsPendingErrorDetails:
      type: object
      properties:
        approvalUrl:
          type: string
        code:
          type: string
        errorCode:
          type: string
        message:
          type: string
        missingPermissions:
          type: array
          items:
            type: string
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
  securitySchemes:
    basicAuth:
      description: Basic Authentication
      scheme: basic
      type: http
