components:
  schemas:
    RefExpression:
      type: object
      properties:
        expression:
          type: string
    TargetResource:
      type: object
      properties:
        resourceName:
          type: string
        resourceType:
          type: string
    ResourceAffectedResponse:
      type: object
      properties:
        affectedResources:
          type: array
          items:
            $ref: '#/components/schemas/AffectedResource'
        clusterId:
          type: string
        referencedResources:
          type: array
          items:
            $ref: '#/components/schemas/AffectedResource'
        targetResources:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/TargetResource'
    ResourceHistory:
      type: object
      properties:
        alpha:
          type: boolean
        artifactVersion:
          $ref: '#/components/schemas/HistoryMetadata'
        blueprintVersion:
          $ref: '#/components/schemas/HistoryMetadata'
        clusterId:
          type: string
        clusterName:
          type: string
        disabled:
          type: boolean
        overridden:
          type: boolean
        overrideVersion:
          $ref: '#/components/schemas/HistoryMetadata'
        resourceName:
          type: string
        resourceStatus:
          type: string
          enum:
          - RUNNING
          - STOPPED
        resourceType:
          type: string
    GithubAppPermissionsPendingErrorDetails:
      type: object
      properties:
        approvalUrl:
          type: string
        code:
          type: string
        errorCode:
          type: string
        message:
          type: string
        missingPermissions:
          type: array
          items:
            type: string
    AllRegionsAndAZ:
      type: object
      properties:
        cloud:
          type: string
        regions:
          type: array
          items:
            $ref: '#/components/schemas/RegionAndZone'
    OutputReference:
      type: object
      properties:
        outputDescription:
          type: string
        outputName:
          type: string
        outputTitle:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
    StackResourceLite:
      type: object
      properties:
        description:
          type: string
        displayName:
          type: string
        flavour:
          type: string
        iconUrl:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
        templatedResource:
          type: boolean
        version:
          type: string
    BlueprintFile:
      type: object
      properties:
        alpha:
          type: boolean
        childrenResourceIds:
          uniqueItems: true
          type: array
          items:
            type: string
        ciNames:
          uniqueItems: true
          type: array
          items:
            type: string
        clusterId:
          type: string
        content:
          type: string
        directory:
          type: string
        edges:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/Edge'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/BlueprintValidationError'
        expressions:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/RefExpression'
        filename:
          type: string
        iconUrl:
          type: string
        info:
          $ref: '#/components/schemas/Info'
        overridden:
          type: boolean
        override:
          type: object
          additionalProperties:
            type: object
        parentResourceId:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
        secrets:
          uniqueItems: true
          type: array
          items:
            type: string
        stackName:
          type: string
        substack:
          type: boolean
        syncCtxMd5:
          type: string
        syncId:
          type: string
        templatedResource:
          type: boolean
        variables:
          uniqueItems: true
          type: array
          items:
            type: string
        version:
          type: string
    JsonNode:
      type: object
    ResourceHistoryOverview:
      type: object
      properties:
        artifactVersion:
          $ref: '#/components/schemas/ResourceStatusMetadata'
        blueprintVersion:
          $ref: '#/components/schemas/ResourceStatusMetadata'
        clusterId:
          type: string
        clusterName:
          type: string
        disabled:
          type: boolean
        overridden:
          type: boolean
        overrideVersion:
          $ref: '#/components/schemas/ResourceStatusMetadata'
        releaseButtonStatus:
          $ref: '#/components/schemas/ReleaseButtonStatus'
        resourceName:
          type: string
        resourceStatus:
          type: string
          enum:
          - RUNNING
          - STOPPED
        resourceType:
          type: string
    Info:
      type: object
      properties:
        artifactType:
          type: string
          enum:
          - docker_image
          - freestyle
        artifactory:
          type: string
        ciName:
          type: string
        criticalResource:
          type: boolean
        description:
          type: string
        disabled:
          type: boolean
        enableKubernetesExplorer:
          type: boolean
        flavour:
          type: string
        githubRepositoryUrl:
          type: string
        inheritFromBase:
          type: boolean
        namespace:
          type: string
        overriddenName:
          type: string
        provided:
          type: boolean
        repository:
          type: string
        repositoryPath:
          type: string
        staticImage:
          type: string
        strategy:
          type: string
          enum:
          - RollingUpdate
          - BlueGreen
          - Canary
        tag:
          type: string
        tfModuleId:
          type: string
        ui:
          type: object
          additionalProperties:
            type: object
        version:
          type: string
    PortInfo:
      type: object
      properties:
        port:
          type: string
    StackGitLog:
      type: object
      properties:
        changeLog:
          type: string
          writeOnly: true
        clusterId:
          type: string
        commitLog:
          $ref: '#/components/schemas/CommitLog'
        directory:
          type: string
        filename:
          type: string
        id:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
        stackName:
          type: string
        versioningKey:
          type: string
    ResourceStatusMetadata:
      type: object
      properties:
        liveVersion:
          type: string
        pendingVersion:
          type: string
        previewVersion:
          type: string
    BlueprintValidationError:
      type: object
      properties:
        blueprintErrorLines:
          type: array
          items:
            type: integer
            format: int32
        category:
          type: string
          enum:
          - Syntax Error
          - Non-Existent Resource Reference
          - Disabled Resource References
          - Invalid Reference Expression
          - Schema Compliance Error
          - GuardRails Compliance Issues
          - Overrides Syntax Error
          - Invalid Filename Error
          - Input Validation Error
          - Missing Environment Override
        message:
          type: string
        overrideErrorLines:
          type: array
          items:
            type: integer
            format: int32
        severity:
          type: string
          enum:
          - ERROR
          - WARNING
    ResourceConnectionStringResponse:
      type: object
      properties:
        clusterId:
          type: string
          description: Cluster ID this resource belongs to
        connectionString:
          type: string
          description: Connection string for this interface. May be null if masked.
          example: mysql://user:pass@host:3306/db
        interfaceName:
          type: string
          description: Name of the interface (e.g., reader, writer, cluster)
          example: writer
        path:
          type: string
          description: Path component of the ingress rule, when the interface exposes one. Null for non-ingress resources
          example: /api
        resourceName:
          type: string
          description: Name of the resource
          example: my-database
        resourceType:
          type: string
          description: Type of the resource
          example: mysql
        secret:
          type: boolean
      description: Connection string information for a resource interface
    ReleaseButtonStatus:
      type: object
      properties:
        disabled:
          type: boolean
        nbTooltip:
          type: string
    AffectedResource:
      type: object
      properties:
        blueprintFile:
          $ref: '#/components/schemas/BlueprintFile'
        parent:
          type: boolean
    HistoryMetadata:
      type: object
      properties:
        liveVersionId:
          type: string
        previewVersionId:
          type: string
        versions:
          type: array
          items:
            $ref: '#/components/schemas/Version'
    AffectedResourcesRequest:
      required:
      - targetResources
      type: object
      properties:
        targetResources:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/TargetResource'
    ClusterResourcesResponse.FacetsResource:
      type: object
      properties:
        resourceName:
          type: string
        resourceType:
          type: string
    Versioned:
      type: object
      properties:
        changeLog:
          type: string
          writeOnly: true
        versioningKey:
          type: string
    RegionAndZone:
      type: object
      properties:
        availabilityZones:
          type: array
          items:
            type: string
        region:
          type: string
    Version:
      type: object
      properties:
        archiveDate:
          type: string
          format: date-time
        entity:
          $ref: '#/components/schemas/Versioned'
        id:
          type: string
        sequence:
          type: integer
          format: int64
          writeOnly: true
        sequenceKey:
          type: string
        version:
          type: integer
          format: int64
        versioningKey:
          type: string
    CommitLog:
      type: object
      properties:
        authorEmail:
          type: string
        authorName:
          type: string
        commitDate:
          type: string
          format: date-time
        commitId:
          type: string
        commitMessage:
          type: string
    ClusterResourcesResponse:
      type: object
      properties:
        clusterId:
          type: string
        clusterName:
          type: string
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ClusterResourcesResponse.FacetsResource'
    ServiceOverview:
      type: object
      properties:
        ports:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/PortInfo'
    ErrorDetails:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    Edge:
      type: object
      properties:
        blockEdits:
          type: boolean
        id:
          type: string
        inputName:
          type: string
        isInput:
          type: boolean
        outputName:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
  securitySchemes:
    basicAuth:
      description: Basic Authentication
      scheme: basic
      type: http
