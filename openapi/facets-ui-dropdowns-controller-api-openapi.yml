  /cc-ui/v1/dropdown/cluster-resources-lite:
    get:
      description: 'Cluster-scoped variant of stack-resources-lite: same trimmed projection, but read from the cluster''s blueprint, so version is the environment-resolved value and substack resources are included. Same RBAC semantics as /cluster/{clusterId}/resources-info.'
      operationId: getAllResourcesByClusterLite
      parameters:
      - in: query
        name: clusterId
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StackResourceLite'
          description: OK
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorDetails'
                - $ref: '#/components/schemas/GithubAppPermissionsPendingErrorDetails'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                type: string
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Not Found
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Method Not Allowed
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Conflict
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetails'
          description: Internal Server Error
      summary: List cluster resources (lite)
      tags:
      - ui-dropdowns-controller
