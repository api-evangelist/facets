components:
  schemas:
    GithubAppPermissionsPendingErrorDetails:
      type: object
      properties:
        approvalUrl:
          type: string
        code:
          type: string
        errorCode:
          type: string
        message:
          type: string
        missingPermissions:
          type: array
          items:
            type: string
    ErrorDetails:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    UserVCSTokenResponse:
      type: object
      properties:
        hostName:
          type: string
        id:
          type: string
        userId:
          type: string
        userName:
          type: string
    UserVCSTokenRequest:
      required:
      - hostName
      - personalAccessToken
      - userName
      type: object
      properties:
        hostName:
          type: string
        id:
          type: string
        personalAccessToken:
          type: string
        userName:
          type: string
  securitySchemes:
    basicAuth:
      description: Basic Authentication
      scheme: basic
      type: http
