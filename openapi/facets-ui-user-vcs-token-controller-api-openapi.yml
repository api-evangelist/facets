openapi: 3.2.0
info:
  description: API Documentation
  title: Control-plane UI User VCS Token Controller API
  version: '1.0'
servers:
- url: https://facetsdemo.console.facets.cloud
  description: Generated server url
security:
- basicAuth: []
tags:
