components:
  schemas:
    InputOutputResource:
      type: object
      properties:
        default:
          type: boolean
        outputName:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
    ProvidedUnauthenticatedResource:
      type: object
      properties:
        endpoint:
          type: string
        port:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
    ClusterSchedule:
      required:
      - clusterId
      - releaseType
      type: object
      properties:
        byDay:
          type: array
          items:
            type: string
            enum:
            - MON
            - TUE
            - WED
            - THU
            - FRI
            - SAT
            - SUN
        byTime:
          type: string
          format: time
          example: '14:30'
        clusterId:
          type: string
        createdBy:
          type: string
        creationDate:
          type: string
          format: date-time
        description:
          type: string
        frequency:
          type: string
          enum:
          - PER_MINUTE
          - HOURLY
          - DAILY
          - WEEKLY
        id:
          type: string
        interval:
          type: integer
          format: int32
        isPaused:
          type: boolean
        lastModifiedBy:
          type: string
        lastModifiedDate:
          type: string
          format: date-time
        releaseType:
          type: string
          enum:
          - HOTFIX
          - RELEASE
          - LAUNCH
          - DESTROY
          - CUSTOM
          - UNLOCK_STATE
          - PLAN
          - HOTFIX_PLAN
          - APPLY_PLAN
          - APPLY_HOTFIX_PLAN
          - SCALE_UP
          - SCALE_DOWN
          - MAINTENANCE
          - TERRAFORM_EXPORT
          - ROLLBACK_PLAN
          - APPLY_ROLLBACK_PLAN
          - PLAN_AND_APPLY
          - HOTFIX_PLAN_AND_APPLY
          - IMPORT_RELEASE
        serverTimeZone:
          type: string
        timeZone:
          type: string
          example: Asia/Kolkata
    GroupedCountDto:
      type: object
      properties:
        enabled:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    VariableCountDto:
      type: object
      properties:
        overriddenSecrets:
          type: integer
          format: int32
        overriddenVariables:
          type: integer
          format: int32
        totalSecrets:
          type: integer
          format: int32
        totalVariables:
          type: integer
          format: int32
    ModuleDTO:
      type: object
      properties:
        facetsYaml:
          type: object
          additionalProperties:
            type: object
        tfModulePath:
          $ref: '#/components/schemas/TFModulePath'
    ProvidedShardedService:
      type: object
      properties:
        shards:
          type: array
          items:
            $ref: '#/components/schemas/ProvidedAuthenticatedResource'
    StackTemplateInput:
      required:
      - clusterId
      - data
      - inputType
      - uid
      type: object
      properties:
        clusterId:
          type: string
        data:
          type: object
          additionalProperties:
            type: string
        inputType:
          type: string
        uid:
          type: string
    GithubAppPermissionsPendingErrorDetails:
      type: object
      properties:
        approvalUrl:
          type: string
        code:
          type: string
        errorCode:
          type: string
        message:
          type: string
        missingPermissions:
          type: array
          items:
            type: string
    ShortLivedTaskSchedule:
      required:
      - frequency
      - releaseType
      type: object
      properties:
        frequency:
          type: string
          enum:
          - PER_MINUTE
          - HOURLY
          - DAILY
          - WEEKLY
        releaseType:
          type: string
          enum:
          - HOTFIX
          - RELEASE
          - LAUNCH
          - DESTROY
          - CUSTOM
          - UNLOCK_STATE
          - PLAN
          - HOTFIX_PLAN
          - APPLY_PLAN
          - APPLY_HOTFIX_PLAN
          - SCALE_UP
          - SCALE_DOWN
          - MAINTENANCE
          - TERRAFORM_EXPORT
          - ROLLBACK_PLAN
          - APPLY_ROLLBACK_PLAN
          - PLAN_AND_APPLY
          - HOTFIX_PLAN_AND_APPLY
          - IMPORT_RELEASE
        tearDownAfter:
          type: integer
          format: int32
    ResourceEnableDisableRequest:
      type: object
      properties:
        directory:
          type: string
        disabled:
          type: boolean
        filename:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
    ReleaseDetails:
      type: object
      properties:
        deploymentLogId:
          type: string
        releaseType:
          type: string
          enum:
          - HOTFIX
          - RELEASE
          - LAUNCH
          - DESTROY
          - CUSTOM
          - UNLOCK_STATE
          - PLAN
          - HOTFIX_PLAN
          - APPLY_PLAN
          - APPLY_HOTFIX_PLAN
          - SCALE_UP
          - SCALE_DOWN
          - MAINTENANCE
          - TERRAFORM_EXPORT
          - ROLLBACK_PLAN
          - APPLY_ROLLBACK_PLAN
          - PLAN_AND_APPLY
          - HOTFIX_PLAN_AND_APPLY
          - IMPORT_RELEASE
        stackVersion:
          type: string
        triggeredBy:
          type: string
        triggeredOn:
          type: string
          format: date-time
    ResourceDetails:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
        value:
          type: string
    PauseReleaseRequest:
      type: object
      properties:
        clusterId:
          type: string
        pauseReleases:
          type: boolean
    ModuleInputDTO:
      type: object
      properties:
        compatibleResources:
          uniqueItems: true
          type: array
          items:
            $ref: '#/components/schemas/InputOutputResource'
        description:
          type: string
        displayName:
          type: string
        optional:
          type: boolean
        type:
          type: string
    ClusterMetadata:
      type: object
      properties:
        cloud:
          type: string
          enum:
          - AWS
          - AZURE
          - LOCAL
          - GCP
          - KUBERNETES
          - NO_CLOUD
        clusterId:
          type: string
        clusterName:
          type: string
        clusterState:
          type: string
          enum:
          - STOPPED
          - RUNNING
          - LAUNCHING
          - DESTROYING
          - LAUNCH_FAILED
          - DESTROY_FAILED
          - UNKNOWN
          - SCALE_DOWN
          - SCALING_DOWN
          - SCALE_DOWN_FAILED
          - SCALING_UP
          - SCALE_UP_FAILED
        id:
          type: string
        stackName:
          type: string
    ClusterLite:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        stackName:
          type: string
    ResourceInheritFromBaseRequest:
