related_quotas:
  - name: Praxis per-user AI credit allocation
    scope: per-user, within an org-wide monthly budget
    window: billing cycle
    enforcement: 'Praxis blocks further usage once a user hits their cap, until the next cycle or a higher allocation from an admin.'
    source: https://www.facets.cloud/docs/changelog/release-notes-v092
    note: >-
      This is an AI SPEND cap on the Praxis agent layer, not an HTTP rate limit on the
      Control Plane API. Recorded here because it is the only published usage ceiling of any
      kind, and deliberately kept out of limits[] so it is not counted as an API rate limit.
recommendation: >-
  With nothing published, treat the API as unmetered but fragile: back off exponentially with
  jitter on 500, and re-read state rather than blind-retrying on 409, because the API has no
  idempotency mechanism (see conventions/facets-conventions.yml).
