naming_trap:
  note: >-
    The same object has three names depending on which Facets surface you are on, and this is
    the single most likely cause of a wrong call. REST calls it a `stack`; the UI, CLI and
    MCP servers call it a `project`. REST calls it a `cluster`; the UI, CLI and MCP servers
    call it an `environment`. Both mappings are one-to-one. An agent reading the OpenAPI and
    the docs at the same time must translate between them.
  mappings:
    - {rest: stack, product: project}
    - {rest: cluster, product: environment}
    - {rest: 'artifact (registered image/zip)', product: build}
    - {rest: 'artifact CI (named CI integration)', product: artifact}
