    releaseTraceId at /cc-ui/v1/clusters/{clusterId}/deployments/trace-id/{releaseTraceId} -
    which is the closest thing to a correlation handle in the API, and it is release-scoped,
    not request-scoped.
  audit_trail: 'getAuditLogs (/cc-ui/v1/audit-logs) with entity and entity-action filters; Praxis agent activity is attributed in the audit log since release v0.89.'
