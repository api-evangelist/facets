versioning:
  scheme: uri-path
  api_versions: [v1]
  current: v1
  note: >-
    Two things version independently and it matters. The API PATH version has been v1 since
    the product shipped - every operation sits under /cc-ui/v1, /public/v1, /public-ui/v1 or
    /api. The PLATFORM version moves on a roughly monthly release train (v0.94 as of
    2026-09-02) and is what the changelog tracks. A "v2" appears only as an operation-level
    suffix (createStackV2, registerArtifactV2, releaseV2, getResourceByNameV2) alongside the
    v1 original, never as a new path version. Consequence for a consumer: there is no version
    negotiation, no version header, and no way to pin - you get whatever the control plane
    you are pointed at is running.
  spec_version:
    field: info.version
    value: '1.0'
    note: The generated spec's info.version is the constant string "1.0" and does not track the platform release.
release_train:
  cadence: roughly monthly
  current: '0.94'
  current_date: '2026-09-02'
  changelog: https://www.facets.cloud/docs/changelog
  note: Self-hosted (Enterprise) customers run the control plane in their own VPC, so the version an API consumer faces depends on when that customer upgraded.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    Facets publishes NO API deprecation policy - no notice period, no sunset dates, no RFC
    8594 Sunset/Deprecation headers, and no removal log. It does mark 14 operations
    deprecated:true in the spec, which is a real signal and better than nothing, but nothing
    tells a consumer how long a deprecated operation will keep working. The one lifecycle
    policy Facets does publish is for the CLI, not the API:
    https://www.facets.cloud/docs/features-and-guides/cli/unsupported-versions.
  in_spec_signal: true
