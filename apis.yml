aid: facets
name: Facets
description: >-
  Facets is an AI-native SDLC orchestrator and platform-engineering control plane that
  unifies infrastructure provisioning, CI/CD and configuration management into a single
  declarative blueprint model, so product teams get self-serve, drift-free cloud environments
  without writing Terraform by hand. The Facets Control Plane exposes a 629-operation REST
  API - published as OpenAPI 3.0.1 at /v3/api-docs on each customer's own control-plane host
  - covering blueprints, projects, environments, releases, resources, artifacts, modules,
  notifications and access control. Facets also ships two first-party CLIs (raptor and
  praxis), three MCP servers, a Terraform provider, and Praxis, a set of AI agents that
  automate platform operations across the SDLC.
