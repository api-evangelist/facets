apis:
  - aid: facets:facets
    name: Facets Control Plane API
    description: >-
      The Facets Control Plane REST API. 519 paths and 629 operations across blueprints
      (stacks), environments (clusters), releases, resources, overrides, artifacts and
      builds, modules, variables and secrets, notifications, cloud and VCS accounts, and
      RBAC. Authentication is HTTP Basic - your control-plane sign-in email plus a personal
      access token. Each customer is served from their own control-plane host, so the base
      URL is templated; the published OpenAPI names the Facets demo tenant because springdoc
      generates servers[] from the host that served the document.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
