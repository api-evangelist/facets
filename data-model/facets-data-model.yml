note: >-
  Relationships in this API are carried by NAME STRINGS, not by nested objects or typed
  references. Stack.name, AbstractCluster.stackName, Artifact.clusterId,
  OverrideObject.resourceName - the graph is joinable but nothing in the schema declares the
  join, so every `via` field below was derived by matching a field name to the path parameter
  that addresses the owning entity. Two schema quirks worth knowing before you model against
  it: the spec exposes AbstractCluster rather than a concrete Cluster type, and several
  entities carry a `versioningKey` string that is the handle the blueprint version history
  is keyed on.
